services:
  subtitle-forge:
    build: .
    image: subtitle-forge:1.1.17
    container_name: subtitle-forge
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8310}:8310"
    environment:
      - TZ=Asia/Shanghai
      - WEB_PORT=8310
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MODE=${MODE:-manual}
      - QUEUE_PAUSED=${QUEUE_PAUSED:-false}
      - WATCH_DIRS=${WATCH_DIRS:-/media/library,/media/library,/media/library,/media/collection,/media/misc}
      - SCAN_INTERVAL_MINUTES=${SCAN_INTERVAL_MINUTES:-60}
      - SCAN_INTERVAL_VALUE=${SCAN_INTERVAL_VALUE:-60}
      - SCAN_INTERVAL_UNIT=${SCAN_INTERVAL_UNIT:-minutes}
      - TASK_WORKERS=${TASK_WORKERS:-1}
      - TRANSCRIBE_WORKERS=${TRANSCRIBE_WORKERS:-auto}
      - TRANSLATE_WORKERS=${TRANSLATE_WORKERS:-auto}
      - SMART_QUEUE=${SMART_QUEUE:-true}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-false}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}
      - VIDEO_EXTS=${VIDEO_EXTS:-.mp4,.mkv,.avi,.mov,.wmv,.flv,.webm,.ts,.m2ts}
      - ASR_MODEL=${ASR_MODEL:-small}
      - ASR_DEVICE=${ASR_DEVICE:-auto}
      - ASR_COMPUTE_TYPE=${ASR_COMPUTE_TYPE:-int8}
      - ASR_LANGUAGE=${ASR_LANGUAGE:-auto}
      - ASR_PROVIDER=${ASR_PROVIDER:-local}
      - LLAMA_SWAP_CONFIG=${LLAMA_SWAP_CONFIG:-/config-llama.yaml}
      - LLAMA_MODELS_DIR=${LLAMA_MODELS_DIR:-/models-llama}
      - LLAMA_SWAP_CONTAINER=${LLAMA_SWAP_CONTAINER:-llama-swap}
      - MULTI_MODEL_VRAM_MB=${MULTI_MODEL_VRAM_MB:-16000}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
      - SAKURA_CONTAINER=${SAKURA_CONTAINER:-llama-sakura}
      - PHASE_MODE=${PHASE_MODE:-pipeline}
      - REVIEW_BASE_URL=${REVIEW_BASE_URL:-}
      - REVIEW_API_KEY=${REVIEW_API_KEY:-}
      - REVIEW_MODEL=${REVIEW_MODEL:-}
      - REVIEW_SAMPLE_COUNT=${REVIEW_SAMPLE_COUNT:-12}
      - SOURCE_LANG=${SOURCE_LANG:-auto}
      - TARGET_LANG=${TARGET_LANG:-zh}
      - MAX_WORKERS=${MAX_WORKERS:-1}
      - TRANSLATE_ONLY=${TRANSLATE_ONLY:-false}
      - SKIP_EXISTING_SUBTITLE=${SKIP_EXISTING_SUBTITLE:-true}
      - SUBTITLE_SUFFIX=${SUBTITLE_SUFFIX:-.zh}
      - TRANSCRIPT_QUALITY_THRESHOLD=${TRANSCRIPT_QUALITY_THRESHOLD:-60}
      - TRANSLATION_QUALITY_THRESHOLD=${TRANSLATION_QUALITY_THRESHOLD:-70}
    volumes:
      - /mnt/media1:/media/library:rw
      - /mnt/media2:/media/library:rw
      - /mnt/media3:/media/library:rw
      - /mnt/media4:/media/collection:rw
      - /mnt/media5:/media/misc:rw
      - /mnt/media6:/media/videos:rw
      - /mnt/music:/media/music:rw
      - /mnt/study:/media/study:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${LLAMA_MODELS_HOST:-/mnt/llama/models}:/models-llama:rw
      - /mnt/llama-swap/config.yaml:/config-llama.yaml:rw
      - ./config:/app/config:rw
      - ./data:/app/data:rw
      - ./models:/app/models:rw
      - ./logs:/app/logs:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    gpus: all
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
